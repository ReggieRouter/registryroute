<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Registry Route</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <div class="brand-kicker">Accurate &middot; Fast &middot; Verified &middot; <span class="secure">Secure.</span></div>
    <div class="brand-title-row">
      <h1 class="brand-title">Registry Route</h1>
      <div class="brand-divider"></div>
      <div class="brand-cobrand">
        <span class="cobrand-by">BY</span>
        <img src="lendpaper-wordmark.svg" alt="LendPaper" class="cobrand-logo">
      </div>
    </div>
    <div class="brand-tagline">Secretary of State routing</div>
  </header>

  <div class="field">
    <input id="query" type="text" autocomplete="off" spellcheck="false"
           placeholder="Company name or EIN — pre-fills where supported"
           aria-label="Company name or EIN">
    <button id="query-clear" class="clear" type="button" title="Clear" aria-label="Clear">&times;</button>
  </div>

  <div class="field">
    <input id="filter" type="text" autocomplete="off" spellcheck="false"
           placeholder="Type a state (e.g., TX or Texas)…" aria-label="Filter states">
  </div>

  <div id="list" class="list" role="list"></div>
  <p id="empty" class="empty" hidden>No state matches that.</p>

  <footer class="foot">
    <a href="https://www.registryroute.com" target="_blank" rel="noopener noreferrer">registryroute.com</a>
    <span>Runs offline &middot; nothing is sent anywhere</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
