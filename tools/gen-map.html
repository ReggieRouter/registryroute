<!doctype html>
<html>
<head><meta charset="utf-8"><title>Registry Route — map path generator</title></head>
<body>
<pre id="out">working…</pre>

<!-- Build-time only. Fetches us-atlas, projects with Albers USA, simplifies, and
     emits extension/popup/us-map.js. The extension itself ships no mapping
     library and makes no network calls — this runs once, output is committed. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const MAP_W = 740;          // map width inside an 800px popup
const TOL   = 0.35;         // Douglas-Peucker tolerance, in projected px
const MIN_RING_AREA = 1.5;  // drop islands smaller than this (projected px^2)
const CALLOUT_MAX = 24;     // states thinner than this can't be clicked reliably

// FIPS -> USPS. Territories are excluded: states.json covers 50 states + DC.
const FIPS = {
  '01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT','10':'DE',
  '11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL','18':'IN','19':'IA',
  '20':'KS','21':'KY','22':'LA','23':'ME','24':'MD','25':'MA','26':'MI','27':'MN',
  '28':'MS','29':'MO','30':'MT','31':'NE','32':'NV','33':'NH','34':'NJ','35':'NM',
  '36':'NY','37':'NC','38':'ND','39':'OH','40':'OK','41':'OR','42':'PA','44':'RI',
  '45':'SC','46':'SD','47':'TN','48':'TX','49':'UT','50':'VT','51':'VA','53':'WA',
  '54':'WV','55':'WI','56':'WY'
};

// Douglas-Peucker over an OPEN chain of points.
function dpOpen(pts, tol) {
  if (pts.length < 3) return pts;
  let maxD = 0, idx = 0;
  const [ax, ay] = pts[0], [bx, by] = pts[pts.length - 1];
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
  for (let i = 1; i < pts.length - 1; i++) {
    const px = pts[i][0] - ax, py = pts[i][1] - ay;
    const d = len < 1e-9 ? Math.hypot(px, py) : Math.abs(px * dy - py * dx) / len;
    if (d > maxD) { maxD = d; idx = i; }
  }
  if (maxD <= tol) return [pts[0], pts[pts.length - 1]];
  return dpOpen(pts.slice(0, idx + 1), tol).slice(0, -1).concat(dpOpen(pts.slice(idx), tol));
}

// A closed ring's first and last point are identical, so the DP baseline has
// zero length and the whole ring collapses to two points. Split at the point
// farthest from the start, simplify each half as an open chain, then rejoin.
function dpRing(ring, tol) {
  const pts = ring.slice(0, -1);
  if (pts.length < 4) return ring;
  let far = 0, fd = -1;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]);
    if (d > fd) { fd = d; far = i; }
  }
  const a = dpOpen(pts.slice(0, far + 1), tol);
  const b = dpOpen(pts.slice(far).concat([pts[0]]), tol);
  return a.slice(0, -1).concat(b);
}

const ringArea = (r) => {
  let a = 0;
  for (let i = 0, n = r.length - 1; i < n; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
  return Math.abs(a / 2);
};

(async function () {
  const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
  const all = topojson.feature(us, us.objects.states).features;
  const feats = all.filter(f => FIPS[String(f.id).padStart(2, '0')]);

  const proj = d3.geoAlbersUsa().fitWidth(MAP_W, { type: 'FeatureCollection', features: feats });
  const path = d3.geoPath(proj);

  const paths = {}, labels = {}, dims = {};
  let maxY = 0;

  for (const f of feats) {
    const abbr = FIPS[String(f.id).padStart(2, '0')];
    const g = f.geometry;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;

    let d = '';
    for (const poly of polys) {
      const projected = poly[0].map(c => proj(c)).filter(Boolean);
      if (projected.length < 4) continue;
      if (ringArea(projected) < MIN_RING_AREA) continue;
      const s = dpRing(projected, TOL);
      d += 'M' + s.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
    }
    if (!d) continue;

    paths[abbr] = d;

    const b = path.bounds(f);
    const w = b[1][0] - b[0][0], h = b[1][1] - b[0][1];
    dims[abbr] = { w: +w.toFixed(1), h: +h.toFixed(1), min: +Math.min(w, h).toFixed(1) };
    maxY = Math.max(maxY, b[1][1]);

    // geoPath.centroid is area-weighted, so it lands inside odd shapes (FL, MI)
    // where a bbox midpoint would fall in the sea.
    const c = path.centroid(f);
    labels[abbr] = [+c[0].toFixed(1), +c[1].toFixed(1)];
  }

  const callouts = Object.keys(dims).filter(a => dims[a].min < CALLOUT_MAX)
    .sort((a, b) => dims[a].min - dims[b].min);

  const out = {
    width: MAP_W,
    height: Math.ceil(maxY),
    paths,
    labels,
    callouts,
    dims
  };

  const js = '// GENERATED by tools/gen-map.html — do not hand-edit.\n'
    + '// Albers USA, fitWidth(' + MAP_W + '), Douglas-Peucker tol=' + TOL + '.\n'
    + 'window.RR_MAP = ' + JSON.stringify(out) + ';\n';

  document.getElementById('out').textContent = js;
  window.__RR_MAP_JS = js;
  window.__RR_SUMMARY = {
    states: Object.keys(paths).length,
    height: out.height,
    callouts,
    bytes: js.length
  };
})();
</script>
</body>
</html>
